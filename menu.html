<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu utilisateur</title>
    <link rel="stylesheet" href="./css/menu.css">
    <link rel="stylesheet" href="../css/fontawesome/css/all.min.css">
</head>
<body>
    <section>
        <div class="user_menu">
            <div class="pdf_user">
                <div class="user_profil">
                    <img src="../images/pdf.jpeg" alt="">
                    <div class="dot"> </div>
                </div>
                <h6>RAHANTA Lucie</h6>
            </div>
            <div class="element">
                <div class="element1">
                    <i class="fa fa-edit"></i>
                    <span class="span_edit_pdf">Edit profile</span>
                </div>
                <div class="element1">
                    <i class="fa fa-cog"></i>
                    <span class="span_edit_pdf">Paramétre général</span>
                </div>
                <div class="element1">
                    <i class="fa fa-history"></i>
                    <span class="span_edit_pdf">Historique</span>
                </div>
            </div>
            <hr>
            <div class="element">
                <div class="element1">
                    <i class="fa fa-poll-h"></i>
                    <span class="span_edit_pdf">Paramétre du compte</span>
                </div>
                <div class="element1">
                    <i class="fa fa-trash-alt"></i>
                    <span class="span_edit_pdf">Supprimer compte</span>
                </div>
            </div>
            <hr>
            <div class="element">
                <div class="element1">
                    <i class="fa fa-sign-out-alt"></i>
                    <span class="span_edit_pdf">Se déconnecter</span>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
